
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <header>
            <h1>📚 Student Task Manager</h1>
            <p>Organize your day, one task at a time.</p>
        </header>

        <section class="stats">
            <div class="stat-card">
                <span>Total Tasks</span>
                <h2 id="total">0</h2>
            </div>
            <div class="stat-card">
                <span>Completed</span>
                <h2 id="completed">0</h2>
            </div>
        </section>

        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task..."
                maxlength="150"
                required
            >
            <button type="submit">+ Add Task</button>
        </form>

        <h3>My Tasks</h3>
        <ul id="task-list"></ul>
        <p id="empty-message">No tasks yet. Add your first task!</p>
    </main>
</body>
</html>
